[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Maze generator"
authors = [
    { name = "aunoguei" },
    { name = "ppousser" }
]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]